# Example only -- DO NOT put real credentials in this file or commit it filled in.
# Copy this structure into `kubectl create secret generic ...` or a sealed/external
# secret mechanism. The csi-s3 driver reads these exact keys.
#
# The values below (accessKeyID / secretAccessKey) are the *static access key*
# of a Yandex Cloud IAM service account with the `storage.editor` role on the
# target bucket -- see ../docs/cloud/README.md section 4 for how to create it.
apiVersion: v1
kind: Secret
metadata:
  name: csi-s3-secret
  namespace: kube-system # must match the namespace referenced by k8s/storageclass.yaml
type: Opaque
stringData:
  accessKeyID: "<YANDEX_STATIC_ACCESS_KEY_ID>"
  secretAccessKey: "<YANDEX_STATIC_ACCESS_KEY_SECRET>"
  endpoint: "https://storage.yandexcloud.net"
  region: "ru-central1"
