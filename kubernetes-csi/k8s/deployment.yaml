# Workload that proves the CSI mount works: every 5s it appends a
# timestamped line to a file inside the mounted PVC. Because csi-s3/GeeseFS
# is a FUSE passthrough to the Object Storage bucket, those writes are
# visible with `yc storage s3api list-objects` / in the console immediately.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: csi-s3-writer
  namespace: csi-s3-demo
  labels:
    app: csi-s3-writer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: csi-s3-writer
  template:
    metadata:
      labels:
        app: csi-s3-writer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: writer
          image: busybox:1.36.1
          command:
            - "sh"
            - "-c"
            - |
              set -e
              echo "csi-s3-writer starting, mount=/data/s3"
              while true; do
                echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) hello from csi-s3-writer" >> /data/s3/heartbeat.log
                sleep 5
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: s3-data
              mountPath: /data/s3
          livenessProbe:
            exec:
              command: ["sh", "-c", "test -f /data/s3/heartbeat.log"]
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: s3-data
          persistentVolumeClaim:
            claimName: csi-s3-pvc
