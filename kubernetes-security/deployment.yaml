apiVersion: apps/v1
kind: Deployment
metadata:
  name: homework-deployment
  namespace: homework
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: homework
  template:
    metadata:
      labels:
        app: homework
    spec:
      serviceAccountName: monitoring
      nodeSelector:
        homework: "true"
      initContainers:
        - name: init-index
          image: busybox
          command:
            - wget
            - -O
            - /work/index.html
            - http://example.com
          volumeMounts:
            - name: homework-volume
              mountPath: /work
        - name: init-metrics
          image: curlimages/curl:8.8.0
          command:
            - /bin/sh
            - -c
          args:
            - |
              TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              CACERT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              curl --fail --silent --show-error \
                --cacert "${CACERT}" \
                -H "Authorization: Bearer ${TOKEN}" \
                https://kubernetes.default.svc/metrics \
                -o /work/metrics.html
          volumeMounts:
            - name: homework-volume
              mountPath: /work
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 8000
          command:
            - /bin/sh
            - -c
          args:
            - |
              ln -sf /homework/index.html /usr/share/nginx/html/index.html
              ln -sf /homework/metrics.html /usr/share/nginx/html/metrics.html
              sed -i 's/listen       80;/listen       8000;/g' /etc/nginx/conf.d/default.conf
              nginx -g 'daemon off;'
          readinessProbe:
            httpGet:
              path: /index.html
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - rm -f /homework/index.html /homework/metrics.html
          volumeMounts:
            - name: homework-volume
              mountPath: /homework
      volumes:
        - name: homework-volume
          emptyDir: {}
