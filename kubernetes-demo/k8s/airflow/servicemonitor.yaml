# Airflow webserver/scheduler metrics -> Prometheus -> Grafana chain.
#
#   Airflow (StatsD emitter, config.metrics.statsd_on=True)
#         v
#   statsd-exporter sidecar (chart: statsd.enabled=true, see ../../airflow/values.yaml)
#         v  exposes Prometheus text format on :9102/metrics
#   Prometheus (via this ServiceMonitor, scraped by kube-prometheus-stack)
#         v
#   Grafana dashboard (../../monitoring/grafana-dashboard-kubernetes-demo.json)
#
# Requires the Prometheus Operator (installed by kube-prometheus-stack, see
# ../../monitoring/prometheus-values.yaml) watching the `airflow` namespace.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: airflow-statsd-exporter
  namespace: airflow
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: ["airflow"]
  selector:
    matchLabels:
      component: statsd
  endpoints:
    - port: statsd-metrics    # port name exposed by the chart's statsd-exporter Service
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: airflow-webserver
  namespace: airflow
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: ["airflow"]
  selector:
    matchLabels:
      component: webserver
  endpoints:
    - port: airflow-ui        # webserver Service port (8080)
      path: /health
      interval: 30s
