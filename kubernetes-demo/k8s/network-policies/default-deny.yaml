# Cluster-wide default-deny baseline for both project namespaces. The
# per-namespace files (k8s/streamlit/networkpolicy.yaml,
# k8s/airflow/networkpolicy.yaml) already declare their own default-deny +
# allow rules; this file is kept for `kubectl apply -f k8s/` convenience and
# for the `data-platform` MongoDB-only namespace scope.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: data-platform
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
