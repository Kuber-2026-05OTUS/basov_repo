# Variant A (preferred): Ingress + HTTPS.
# Browser -> HTTPS/Ingress -> Service:8501 -> Streamlit Pod:8501
#
# Requires an ingress controller (e.g. ingress-nginx) and cert-manager (or a
# Yandex Cloud-managed certificate) already installed on the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streamlit
  namespace: data-platform
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - rates.PLACEHOLDER-DOMAIN.example
      secretName: streamlit-tls
  rules:
    - host: rates.PLACEHOLDER-DOMAIN.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: streamlit
                port:
                  number: 8501
