apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit
  namespace: data-platform
  labels:
    app.kubernetes.io/name: streamlit
    app.kubernetes.io/part-of: kubernetes-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: streamlit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streamlit
    spec:
      serviceAccountName: streamlit
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: streamlit
          image: registry.example.com/kubernetes-demo/streamlit:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
          envFrom:
            - secretRef:
                name: mongodb-credentials
            - configMapRef:
                name: streamlit-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: streamlit-cache
              mountPath: /app/.streamlit
      volumes:
        - name: tmp
          emptyDir: {}
        - name: streamlit-cache
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: streamlit-config
  namespace: data-platform
data:
  MONGODB_DATABASE: "currency"
  MONGODB_COLLECTION: "rates"
  LOG_LEVEL: "INFO"
