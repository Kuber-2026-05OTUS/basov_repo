# Minimal RBAC for KubernetesExecutor/KubernetesPodOperator: Airflow needs to
# create and watch Pods it launches for tasks (e.g. the Spark job), nothing
# cluster-wide and never cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-pod-launcher
  namespace: data-platform
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-spark-worker
  namespace: data-platform
automountServiceAccountToken: false   # the launched Spark job pod does not call the k8s API itself
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-scheduler
  namespace: airflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-scheduler-pod-launcher
  namespace: data-platform
subjects:
  - kind: ServiceAccount
    name: airflow-scheduler
    namespace: airflow
roleRef:
  kind: Role
  name: airflow-pod-launcher
  apiGroup: rbac.authorization.k8s.io
