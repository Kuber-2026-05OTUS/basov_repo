# Learning-environment MongoDB. Architecturally, prefer a managed external
# MongoDB (Yandex Managed MongoDB, MongoDB Atlas, etc.) in production -- see
# docs/cloud/README.md "MongoDB" section. This StatefulSet exists so the
# whole pipeline is demoable inside the cluster without an external service.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: data-platform
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
    spec:
      serviceAccountName: mongodb
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: mongodb
          image: mongo:7.0.14
          ports:
            - containerPort: 27017
              name: mongodb
          envFrom:
            - secretRef:
                name: mongodb-admin-credentials
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # mongod needs to write its data directory
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongodb
  namespace: data-platform
automountServiceAccountToken: false
