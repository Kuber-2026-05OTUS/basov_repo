apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: data-platform
  labels:
    app.kubernetes.io/name: mongodb
spec:
  clusterIP: None   # headless, StatefulSet-backed
  selector:
    app.kubernetes.io/name: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
