# Template only -- never commit real values. See docs/cloud/README.md
# "Secrets" section for how to create the real Secret safely (kubectl
# --from-literal, or Yandex Cloud Lockbox + External Secrets Operator).
#
# A Kubernetes Secret is base64-ENCODED, not encrypted -- do not treat a
# checked-in Secret manifest as protected just because values are base64.
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  namespace: data-platform
type: Opaque
stringData:
  MONGODB_URI: "mongodb://USER:PASSWORD@HOST:PORT/DATABASE"
  MONGODB_USERNAME: "REPLACE_ME"
  MONGODB_PASSWORD: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-fernet-secret
  namespace: airflow
type: Opaque
stringData:
  AIRFLOW_FERNET_KEY: "REPLACE_ME"   # python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  AIRFLOW_SECRET_KEY: "REPLACE_ME"   # python3 -c "import secrets; print(secrets.token_hex(32))"
