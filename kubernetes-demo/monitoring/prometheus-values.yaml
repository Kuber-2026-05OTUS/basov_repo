# Minimal kube-prometheus-stack values for this demo. Tune retention/storage
# for a real cluster; these are conservative defaults for a small
# Yandex Cloud Managed Kubernetes node pool.
prometheus:
  prometheusSpec:
    retention: 15d
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 1Gi
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false

grafana:
  adminPassword: "REPLACE_ME_OR_USE_EXISTING_SECRET"  # prefer `admin.existingSecret` in production
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 5Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
