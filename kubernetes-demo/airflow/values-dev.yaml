# Development overlay: smaller footprint, bundled Postgres, verbose logs.
postgresql:
  enabled: true

webserver:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

scheduler:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

config:
  logging:
    logging_level: "DEBUG"

data:
  metadataSecretName: ~  # use chart-bundled Postgres in dev
