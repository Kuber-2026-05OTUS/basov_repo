# Shared, environment-agnostic Airflow Helm values.
# Chart: apache-airflow/airflow, version 1.15.0 (see ../README.md).
# Apply with `-f values.yaml -f values-<env>.yaml`.

airflowVersion: "2.9.3"
defaultAirflowTag: "2.9.3-python3.11"
images:
  airflow:
    repository: apache/airflow
    tag: "2.9.3-python3.11"
    pullPolicy: IfNotPresent

executor: "KubernetesExecutor"

webserver:
  replicas: 2
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    initialDelaySeconds: 15
    periodSeconds: 20
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false

scheduler:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false

triggerer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

workers:
  # Not used under KubernetesExecutor; kept disabled explicitly.
  replicas: 0

config:
  core:
    executor: "KubernetesExecutor"
  logging:
    logging_level: "INFO"
  kubernetes_executor:
    namespace: "airflow"
    delete_worker_pods: "True"
    delete_worker_pods_on_failure: "False"

# Prometheus-format metrics: statsd-exporter sidecar translates Airflow's
# native StatsD metrics into a scrapeable /metrics endpoint.
# See ../monitoring/README.md for the full StatsD -> Prometheus -> Grafana chain.
statsd:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

serviceAccount:
  create: true
  name: "airflow"
  automountServiceAccountToken: true  # required: KubernetesExecutor launches task pods via the API

podDisruptionBudget:
  enabled: true
  config:
    minAvailable: 1

dags:
  gitSync:
    enabled: true
    repo: "https://github.com/TasksBasovYuriy/basov_repo.git"
    branch: "kubernetes-demo"
    subPath: "kubernetes-demo/dags"
    depth: 1
    wait: 60
