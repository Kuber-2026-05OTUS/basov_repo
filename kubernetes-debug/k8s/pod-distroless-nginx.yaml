# Distroless target pod for the debugging exercise. `kyos0109/nginx-distroless`
# has no shell, no package manager, and no debugging tools -- by design, per
# docs/README.md's "Введение". Pinned to 1.18.0 (not `latest`) -- see
# https://hub.docker.com/r/kyos0109/nginx-distroless/tags.
apiVersion: v1
kind: Pod
metadata:
  name: distroless-nginx
  namespace: debug-demo
  labels:
    app: distroless-nginx
spec:
  containers:
    - name: nginx
      image: kyos0109/nginx-distroless:1.18.0
      ports:
        - containerPort: 80
          name: http
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 64Mi
      # No shell/coreutils exist in this image, so no exec-based probes;
      # a plain TCP probe is the most this image supports without tooling.
      readinessProbe:
        tcpSocket:
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 5
      livenessProbe:
        tcpSocket:
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: distroless-nginx
  namespace: debug-demo
spec:
  selector:
    app: distroless-nginx
  ports:
    - port: 80
      targetPort: 80
