apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-exporter-deployment
  namespace: monitoring-hw
  labels:
    app: nginx-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-exporter
  template:
    metadata:
      labels:
        app: nginx-exporter
    spec:
      containers:
      - name: nginx
        image: custom-nginx:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: web
      - name: nginx-prometheus-exporter
        image: nginx/nginx-prometheus-exporter:1.1.0
        args:
          - "--nginx.scrape-uri=http://localhost:80/stub_status"
        ports:
        - containerPort: 9113
          name: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-exporter-svc
  namespace: monitoring-hw
  labels:
    app: nginx-exporter
spec:
  ports:
  - port: 80
    targetPort: 80
    name: web
  - port: 9113
    targetPort: 9113
    name: metrics
  selector:
    app: nginx-exporter