deploymentMode: Monolithic

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: s3

    bucketNames:
      chunks: loki-data
      ruler: loki-data
      admin: loki-data

    s3:
      endpoint: minio.minio.svc.cluster.local:9000
      accessKeyId: admin
      secretAccessKey: admin123
      region: us-east-1
      s3ForcePathStyle: true
      insecure: true

singleBinary:
  replicas: 1

  nodeSelector:
    node-role: infra

  tolerations:
    - key: node-role
      operator: Equal
      value: infra
      effect: NoSchedule

gateway:
  enabled: true

  nodeSelector:
    node-role: infra

  tolerations:
    - key: node-role
      operator: Equal
      value: infra
      effect: NoSchedule

lokiCanary:
  enabled: true

  nodeSelector:
    node-role: infra

  tolerations:
    - key: node-role
      operator: Equal
      value: infra
      effect: NoSchedule

backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

ingester:
  replicas: 0

querier:
  replicas: 0

queryFrontend:
  replicas: 0

queryScheduler:
  replicas: 0

distributor:
  replicas: 0

compactor:
  replicas: 0

indexGateway:
  replicas: 0

bloomPlanner:
  replicas: 0

bloomBuilder:
  replicas: 0

bloomGateway:
  replicas: 0

chunksCache:
  replicas: 0

resultsCache:
  replicas: 0

minio:
  enabled: false
