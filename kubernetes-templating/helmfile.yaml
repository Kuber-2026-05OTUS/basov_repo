repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

releases:
  - name: kafka-prod
    namespace: prod
    createNamespace: true
    chart: bitnami/kafka
    values:
      - image:
          tag: "3.5.2"
      - broker:
          replicaCount: 5
      - listeners:
          client:
            protocol: SASL_PLAINTEXT
          interbroker:
            protocol: SASL_PLAINTEXT
      - sasl:
          enabled: true
      # If using older chart (with zookeeper)
      - zookeeper:
          enabled: false
      - kraft:
          enabled: true

  - name: kafka-dev
    namespace: dev
    createNamespace: true
    chart: bitnami/kafka
    values:
      - broker:
          replicaCount: 1
      - listeners:
          client:
            protocol: PLAINTEXT
          interbroker:
            protocol: PLAINTEXT
      - sasl:
          enabled: false
      - auth:
          clientProtocol: none
          interBrokerProtocol: none
      - zookeeper:
          enabled: false
      - kraft:
          enabled: true
